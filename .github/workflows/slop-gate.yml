name: slop-gate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gate anti-slop
        run: python3 scripts/slop_gate.py

      - name: Prova jogável (apenas em PR)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          python3 scripts/slop_gate.py --diff-base "origin/${{ github.base_ref }}"

      - name: Suíte
        run: python3 -m pytest tests -q
